<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
import * as THREE from './three.module.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
camera.position.set(0, 0.05, 7.2); camera.lookAt(0, 0, 0);

// A plain, unbranded test shirt: T-shirt silhouette, extruded with soft edges.
const s = new THREE.Shape();
const P = [[0,1.02],[0.16,1.05],[0.29,1.16],[0.56,1.10],[0.80,0.98],[1.02,0.72],[0.86,0.47],[0.64,0.60],[0.63,-1.12],[0.40,-1.16],[0,-1.17]];
s.moveTo(-P[P.length-1][0], P[P.length-1][1]);
const pts = [...P.slice().reverse().map(([x,y])=>[-x,y]), ...P.slice(1)];
s.moveTo(pts[0][0], pts[0][1]); for (const [x,y] of pts.slice(1)) s.lineTo(x,y);
const depth = 0.46;
const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.08, bevelSegments: 8, curveSegments: 24 });
geo.translate(0, 0, -depth/2);
geo.computeVertexNormals();
const base = new THREE.MeshStandardMaterial({ color: 0x15306e, roughness: 0.62, metalness: 0.0 });
const shirt = new THREE.Mesh(geo, base);
const group = new THREE.Group(); group.add(shirt); scene.add(group);

function decal(draw, z, flip) {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024; const g = cv.getContext('2d'); draw(g);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sg = new THREE.ShapeGeometry(s, 24);
  // map shape coords (-1.1..1.1, -1.2..1.2) to 0..1
  const uv = sg.attributes.uv; const pos = sg.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 1.15) / 2.3, (pos.getY(i) + 1.2) / 2.4);
  const m = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6 }));
  m.position.z = z; if (flip) { m.rotation.y = Math.PI; }
  group.add(m);
}
const X = (x) => (x + 1.15) / 2.3 * 1024, Y = (y) => (1 - (y + 1.2) / 2.4) * 1024;
// front: gold collar trim, a diagonal sash and a small plain round emblem
decal((g) => {
  g.strokeStyle = '#d6b25e'; g.lineWidth = 26; g.beginPath(); g.moveTo(X(-0.29),Y(1.16)); g.quadraticCurveTo(X(0),Y(0.93),X(0.29),Y(1.16)); g.stroke();
  g.fillStyle = 'rgba(214,178,94,0.95)'; g.beginPath(); g.moveTo(X(-0.63),Y(0.25)); g.lineTo(X(-0.63),Y(-0.05)); g.lineTo(X(0.63),Y(0.75)); g.lineTo(X(0.63),Y(1.05)); g.closePath(); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(X(-0.33),Y(0.70),40,0,Math.PI*2); g.fill();
  g.fillStyle = '#15306e'; g.beginPath(); g.arc(X(-0.33),Y(0.70),24,0,Math.PI*2); g.fill();
  g.strokeStyle = '#d6b25e'; g.lineWidth = 18; for (const sx of [-1,1]) { g.beginPath(); g.moveTo(X(sx*1.0),Y(0.70)); g.lineTo(X(sx*0.85),Y(0.47)); g.stroke(); }
}, depth/2 + 0.161, false);
// back: a big plain test number
decal((g) => {
  g.fillStyle = '#d6b25e'; g.font = 'bold 300px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('24', 512, Y(0.15));
  g.strokeStyle = '#d6b25e'; g.lineWidth = 26; g.beginPath(); g.moveTo(X(-0.29),Y(1.16)); g.quadraticCurveTo(X(0),Y(1.08),X(0.29),Y(1.16)); g.stroke();
}, -(depth/2 + 0.161), true);

scene.add(new THREE.AmbientLight(0xbfd0ff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb4ff, 2.4); rim.position.set(-4, 3, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0x9db8ff, 0.8); fill.position.set(-5, 1, 3); scene.add(fill);

window.renderAt = (deg) => { group.rotation.y = -deg * Math.PI / 180; renderer.render(scene, camera); return canvas.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
